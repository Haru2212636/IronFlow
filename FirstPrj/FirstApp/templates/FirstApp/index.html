<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronFlow - Workout Tracker</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <h1>IronFlow</h1>
    </header>

    <main class="page-container">
        <section class="card">
            <h2>Log Your Workout</h2>
            <form action="#" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="exercise-name">Exercise Name</label>
                    <input type="text" id="exercise-name" name="exercise" placeholder="e.g., Bench Press" required>
                </div>
                
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" name="weight" placeholder="e.g., 60" required>
                </div>

                <button type="submit" class="btn">Save Workout</button>
            </form>
        </section>
    </main>
</body>
</html>
